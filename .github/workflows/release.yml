name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet test Dbox.sln

  validate-windows-installer:
    name: Validate Windows installer
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $originalLocalAppData = $env:LOCALAPPDATA
          $originalUserPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "dbox-install"

          try {
            .\install.ps1
            if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "dbox\bin\dbox.exe"))) {
              throw "Installer did not create dbox.exe."
            }
          }
          finally {
            [Environment]::SetEnvironmentVariable("Path", $originalUserPath, "User")
            Remove-Item -Path $env:LOCALAPPDATA -Recurse -Force -ErrorAction SilentlyContinue
            $env:LOCALAPPDATA = $originalLocalAppData
          }

          try {
            function Invoke-WebRequest { throw "HTTP 404" }
            . .\install.ps1
            throw "Installer did not fail after a download error."
          }
          catch {
            if ($_.Exception.Message -notlike "Failed to download dbox-win-x64.exe from the latest GitHub Release.*") {
              throw
            }
          }

  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    needs: [validate, validate-windows-installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            executable: dbox
            asset: dbox-linux-x64
          - rid: linux-arm64
            executable: dbox
            asset: dbox-linux-arm64
          - rid: win-x64
            executable: dbox.exe
            asset: dbox-win-x64.exe
          - rid: osx-x64
            executable: dbox
            asset: dbox-osx-x64
          - rid: osx-arm64
            executable: dbox
            asset: dbox-osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet publish src/Dbox/Dbox.csproj --configuration Release --runtime "${{ matrix.rid }}" --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output publish
      - run: mv "publish/${{ matrix.executable }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.name }}
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            runner: macos-15-intel
            asset: dbox-osx-x64
          - name: Windows x64
            runner: windows-latest
            asset: dbox-win-x64.exe
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset }}
          path: smoke-assets
      - if: runner.os != 'Windows'
        run: |
          chmod +x "smoke-assets/${{ matrix.asset }}"
          "smoke-assets/${{ matrix.asset }}" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '& "smoke-assets/${{ matrix.asset }}" --version'

  release:
    needs: [publish, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            ## Release details

            - Version: `${{ github.ref_name }}`
            - Source commit: `${{ github.sha }}`
            - Build: [GitHub Actions run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ## Included binaries

            | Platform | Asset |
            | --- | --- |
            | Linux x64 | `dbox-linux-x64` |
            | Linux ARM64 | `dbox-linux-arm64` |
            | macOS x64 | `dbox-osx-x64` |
            | macOS ARM64 | `dbox-osx-arm64` |
            | Windows x64 | `dbox-win-x64.exe` |

            ## Installation

            Linux/macOS:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash
            ```

            Windows:
            ```powershell
            irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex
            ```

            ## Verify

            ```bash
            dbox --version
            dbox --help
            ```
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/dbox-linux-x64 \
            release-assets/dbox-linux-arm64 \
            release-assets/dbox-osx-x64 \
            release-assets/dbox-osx-arm64 \
            release-assets/dbox-win-x64.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "dbox $GITHUB_REF_NAME" \
            --notes "$RELEASE_NOTES" \
            --generate-notes \
            --verify-tag
